services:
  postgres:
    image: 'postgres:17'
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
  redis:
    image: 'redis:latest'
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data:
  redis_data: