spring:
  application.name: easyplan
  config.import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only
      file: compose.yaml